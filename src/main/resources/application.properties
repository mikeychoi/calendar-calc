spring.application.name=calendar-calc

# --- Database (file-based H2: data survives restarts, stored in ./data/) ---
spring.datasource.url=jdbc:h2:file:./data/calendar-calc
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
# Create or alter tables to match our @Entity classes on startup (local development only).
spring.jpa.hibernate.ddl-auto=update
# Close the database session when the service layer finishes, not after the HTTP response is written.
spring.jpa.open-in-view=false

# --- H2 web console (local development only) ---
# Browse at http://localhost:8080/h2-console using the JDBC URL above.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
