spring.application.name=calendar-calc

# Tests use a fresh in-memory database, so they never read or modify ./data/.
# DB_CLOSE_DELAY=-1 keeps the database alive for the whole test run instead of
# dropping it when the last connection closes.
spring.datasource.url=jdbc:h2:mem:calendar-calc-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Build the schema from scratch at startup and drop it at shutdown.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

# Same JSON behaviour as the real application (see src/main/resources/application.properties).
spring.jackson.deserialization.accept-float-as-int=false
